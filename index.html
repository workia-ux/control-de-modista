
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Modista</title>

  <style>
    :root {
      --verde-fondo: #edf7ee;
      --verde-principal: #b9dfbd;
      --texto: #344638;
      --blanco: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: var(--verde-fondo);
      color: var(--texto);
    }

    h1 {
      text-align: center;
      margin: 8px 0;
      color: #416b4a;
    }

    .subtitulo {
      text-align: center;
      margin-bottom: 24px;
      color: #647568;
    }

    .contenedor {
      max-width: 1200px;
      margin: auto;
    }

    .boton-nueva {
      display: block;
      margin: 0 auto 24px;
      padding: 13px 22px;
      border: none;
      border-radius: 12px;
      background: #a8d5ad;
      color: #284b30;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .boton-nueva:hover {
      background: #96c99d;
    }

    .formulario {
      display: none;
      background: white;
      padding: 22px;
      border-radius: 16px;
      margin-bottom: 25px;
      box-shadow: 0 3px 12px #00000010;
    }

    .formulario h2 {
      margin-top: 0;
    }

    .campos {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .campo {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .campo.completo {
      grid-column: 1 / -1;
    }

    label {
      font-weight: bold;
      font-size: 14px;
    }

    input, textarea {
      width: 100%;
      padding: 11px;
      border: 1px solid #d5e3d6;
      border-radius: 9px;
      font: inherit;
      background: #fcfffc;
      color: #344638;
    }

    textarea {
      resize: vertical;
      min-height: 75px;
    }

    .acciones-formulario {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .boton {
      border: none;
      border-radius: 9px;
      padding: 11px 17px;
      cursor: pointer;
      font-weight: bold;
    }

    .guardar {
      background: #a8d5ad;
      color: #284b30;
    }

    .cancelar {
      background: #eeeeee;
      color: #444444;
    }

    .tablero {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      align-items: start;
    }

    .columna {
      padding: 14px;
      border-radius: 15px;
      min-height: 300px;
      min-width: 0;
    }

    .espera {
      background: #e5edff;
    }

    .taller {
      background: #fff0d9;
    }

    .entregado {
      background: #dff2df;
    }

    .encabezado-columna {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin: 0 0 14px;
      font-size: 17px;
    }

    .contador {
      background: #ffffffb8;
      padding: 4px 9px;
      border-radius: 20px;
      font-size: 13px;
    }

    .tarjeta {
      background: white;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 12px;
      box-shadow: 0 2px 7px #0000000c;
      overflow-wrap: anywhere;
    }

    .nombre-empresa {
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin: 0;
    }

    .nombre-empresa:hover {
      color: #53825b;
    }

    .detalle {
      display: none;
      border-top: 1px solid #eeeeee;
      margin-top: 12px;
      padding-top: 12px;
      line-height: 1.6;
      font-size: 14px;
    }

    .detalle p {
      margin: 5px 0;
      white-space: pre-wrap;
    }

    .detalle strong {
      color: #506654;
    }

    .acciones-tarjeta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 13px;
    }

    .acciones-tarjeta button,
    .acciones-tarjeta select {
      border: 1px solid #dddddd;
      background: #fafafa;
      border-radius: 7px;
      padding: 7px;
      font-size: 12px;
      cursor: pointer;
    }

    .vacio {
      color: #657568;
      font-size: 13px;
      text-align: center;
      padding: 20px 5px;
    }

    @media (max-width: 800px) {
      body {
        padding: 14px;
      }

      .tablero {
        grid-template-columns: 1fr;
      }

      .columna {
        min-height: 150px;
      }
    }

    @media (max-width: 480px) {
      .campos {
        grid-template-columns: 1fr;
      }

      .campo.completo {
        grid-column: auto;
      }
    }
  </style>
</head>

<body>
  <div class="contenedor">
    <h1>Control de Modista</h1>
    <p class="subtitulo">Organizá tus empresas y prendas</p>

    <button class="boton-nueva" onclick="abrirFormulario()">
      + Nueva empresa
    </button>

    <form class="formulario" id="formulario">
      <h2 id="tituloFormulario">Nueva empresa</h2>

      <div class="campos">
        <div class="campo">
          <label for="empresa">Nueva empresa</label>
          <input id="empresa" type="text" placeholder="Nombre de la empresa">
        </div>

        <div class="campo">
          <label for="prenda">Prenda</label>
          <input id="prenda" type="text" placeholder="Tipo de prenda">
        </div>

        <div class="campo">
          <label for="cantidad">Cantidad</label>
          <input id="cantidad" type="number" min="0" placeholder="Cantidad de prendas">
        </div>

        <div class="campo">
          <label for="modificacion">Modificación</label>
          <input id="modificacion" type="text" placeholder="Modificación a realizar">
        </div>

        <div class="campo completo">
          <label for="observacion">Observación</label>
          <textarea id="observacion" placeholder="Escribí una observación si hace falta"></textarea>
        </div>
      </div>

      <div class="acciones-formulario">
        <button class="boton guardar" type="submit">Guardar</button>
        <button class="boton cancelar" type="button" onclick="cerrarFormulario()">
          Cancelar
        </button>
      </div>
    </form>

    <div class="tablero">
      <section class="columna espera">
        <h2 class="encabezado-columna">
          En espera <span class="contador" id="contador-espera">0</span>
        </h2>
        <div id="lista-espera"></div>
      </section>

      <section class="columna taller">
        <h2 class="encabezado-columna">
          En taller <span class="contador" id="contador-taller">0</span>
        </h2>
        <div id="lista-taller"></div>
      </section>

      <section class="columna entregado">
        <h2 class="encabezado-columna">
          Entregado <span class="contador" id="contador-entregado">0</span>
        </h2>
        <div id="lista-entregado"></div>
      </section>
    </div>
  </div>

  <script>
    const CLAVE = "control_modista_empresas";

    let empresas = cargarEmpresas();
    let editandoId = null;

    function cargarEmpresas() {
      try {
        const datos = JSON.parse(localStorage.getItem(CLAVE));
        return Array.isArray(datos) ? datos : [];
      } catch {
        return [];
      }
    }

    function guardarDatos() {
      localStorage.setItem(CLAVE, JSON.stringify(empresas));
    }

    function abrirFormulario(id = null) {
      editandoId = id;
      const formulario = document.getElementById("formulario");

      formulario.reset();

      if (id !== null) {
        const empresa = empresas.find(item => item.id === id);
        if (!empresa) return;

        document.getElementById("tituloFormulario").textContent =
          "Editar empresa";

        document.getElementById("empresa").value = empresa.empresa;
        document.getElementById("prenda").value = empresa.prenda;
        document.getElementById("cantidad").value = empresa.cantidad;
        document.getElementById("modificacion").value = empresa.modificacion;
        document.getElementById("observacion").value = empresa.observacion;
      } else {
        document.getElementById("tituloFormulario").textContent =
          "Nueva empresa";
      }

      formulario.style.display = "block";
      formulario.scrollIntoView({ behavior: "smooth", block: "start" });
      document.getElementById("empresa").focus();
    }

    function cerrarFormulario() {
      document.getElementById("formulario").style.display = "none";
      document.getElementById("formulario").reset();
      editandoId = null;
    }

    document.getElementById("formulario").addEventListener("submit", function(e) {
      e.preventDefault();

      const datos = {
        empresa: document.getElementById("empresa").value.trim(),
        prenda: document.getElementById("prenda").value.trim(),
        cantidad: document.getElementById("cantidad").value,
        modificacion: document.getElementById("modificacion").value.trim(),
        observacion: document.getElementById("observacion").value.trim()
      };

      if (editandoId !== null) {
        const indice = empresas.findIndex(item => item.id === editandoId);

        if (indice !== -1) {
          empresas[indice] = {
            ...empresas[indice],
            ...datos
          };
        }
      } else {
        empresas.push({
          id: Date.now().toString() + Math.random().toString(16).slice(2),
          ...datos,
          estado: "espera"
        });
      }

      guardarDatos();
      cerrarFormulario();
      mostrarEmpresas();
    });

    function cambiarEstado(id, estado) {
      const empresa = empresas.find(item => item.id === id);
      if (!empresa) return;

      empresa.estado = estado;
      guardarDatos();
      mostrarEmpresas();
    }

    function eliminarEmpresa(id) {
      if (!confirm("¿Querés eliminar esta empresa?")) return;

      empresas = empresas.filter(item => item.id !== id);
      guardarDatos();
      mostrarEmpresas();
    }

    function crearElemento(tag, clase, texto) {
      const elemento = document.createElement(tag);
      if (clase) elemento.className = clase;
      if (texto !== undefined) elemento.textContent = texto;
      return elemento;
    }

    function mostrarEmpresas() {
      const estados = ["espera", "taller", "entregado"];

      estados.forEach(estado => {
        const lista = document.getElementById("lista-" + estado);
        const elementos = empresas.filter(item => item.estado === estado);

        lista.replaceChildren();

        document.getElementById("contador-" + estado).textContent =
          elementos.length;

        if (elementos.length === 0) {
          lista.appendChild(
            crearElemento("p", "vacio", "Todavía no hay empresas")
          );
        }

        elementos.forEach(item => {
          const tarjeta = crearElemento("article", "tarjeta");

          const nombre = crearElemento(
            "p",
            "nombre-empresa",
            item.empresa || "Empresa sin nombre"
          );

          nombre.title = "Hacé clic para ver los detalles";

          const detalle = crearElemento("div", "detalle");

          const campos = [
            ["Prenda", item.prenda],
            ["Cantidad", item.cantidad],
            ["Modificación", item.modificacion],
            ["Observación", item.observacion]
          ];

          campos.forEach(([etiqueta, valor]) => {
            const linea = crearElemento("p");
            const fuerte = crearElemento("strong", "", etiqueta + ": ");
            linea.appendChild(fuerte);
            linea.appendChild(document.createTextNode(valor || "—"));
            detalle.appendChild(linea);
          });

          nombre.addEventListener("click", () => {
            detalle.style.display =
              detalle.style.display === "block" ? "none" : "block";
          });

          const acciones = crearElemento("div", "acciones-tarjeta");

          const selector = document.createElement("select");
          selector.setAttribute("aria-label", "Cambiar estado");

          [
            ["espera", "En espera"],
            ["taller", "En taller"],
            ["entregado", "Entregado"]
          ].forEach(([valor, texto]) => {
            const opcion = document.createElement("option");
            opcion.value = valor;
            opcion.textContent = texto;
            selector.appendChild(opcion);
          });

          selector.value = item.estado;
          selector.addEventListener("change", () => {
            cambiarEstado(item.id, selector.value);
          });

          const editar = crearElemento("button", "", "Editar");
          editar.type = "button";
          editar.addEventListener("click", () => abrirFormulario(item.id));

          const eliminar = crearElemento("button", "", "Eliminar");
          eliminar.type = "button";
          eliminar.addEventListener("click", () => eliminarEmpresa(item.id));

          acciones.append(selector, editar, eliminar);
          tarjeta.append(nombre, detalle, acciones);
          lista.appendChild(tarjeta);
        });
      });
    }

    mostrarEmpresas();
  </script>
</body>
</html>
