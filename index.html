
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Modista</title>

  <style>
    :root {
      --fondo: #f4f5f7;
      --blanco: #ffffff;
      --texto: #172b4d;
      --suave: #667085;
      --borde: #dfe3e8;
      --azul: #3867d6;
      --verde: #18865b;
      --naranja: #c77716;
      --rojo: #c93636;
      --sombra: 0 3px 12px rgba(20, 35, 60, .08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--fondo);
      color: var(--texto);
      font-family: Arial, Helvetica, sans-serif;
    }

    button, input, select, textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .encabezado {
      background: #fff;
      border-bottom: 1px solid var(--borde);
      padding: 22px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .marca h1 {
      font-size: 25px;
      margin: 0 0 5px;
    }

    .marca p {
      color: var(--suave);
      margin: 0;
      font-size: 14px;
    }

    .contenedor {
      max-width: 1500px;
      margin: 0 auto;
      padding: 24px;
    }

    .boton {
      border: 0;
      border-radius: 8px;
      padding: 11px 15px;
      font-weight: 700;
      transition: opacity .15s;
    }

    .boton:hover {
      opacity: .86;
    }

    .boton-principal {
      background: var(--azul);
      color: #fff;
    }

    .boton-secundario {
      background: #edf0f5;
      color: var(--texto);
    }

    .boton-verde {
      background: #e4f5ec;
      color: #126b47;
    }

    .boton-rojo {
      background: #fff0f0;
      color: var(--rojo);
    }

    .estadisticas {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 22px;
    }

    .estadistica {
      background: #fff;
      padding: 18px;
      border-radius: 12px;
      border: 1px solid var(--borde);
      box-shadow: var(--sombra);
    }

    .estadistica span {
      display: block;
      color: var(--suave);
      font-size: 13px;
      margin-bottom: 9px;
    }

    .estadistica strong {
      display: block;
      font-size: 26px;
    }

    .herramientas {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }

    .herramientas input,
    .herramientas select {
      background: #fff;
      border: 1px solid var(--borde);
      border-radius: 8px;
      padding: 11px 12px;
      min-width: 180px;
    }

    .herramientas input {
      flex: 1;
    }

    .tablero {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      align-items: start;
    }

    .columna {
      background: #e9edf3;
      border-radius: 12px;
      padding: 13px;
      min-height: 270px;
      border: 1px solid #e0e5ed;
    }

    .columna.cargando {
      outline: 2px dashed var(--azul);
      outline-offset: -5px;
    }

    .columna-cabecera {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 14px;
      padding: 3px 2px;
    }

    .columna-cabecera h2 {
      font-size: 15px;
      margin: 0;
    }

    .cantidad {
      background: #fff;
      color: var(--suave);
      border-radius: 20px;
      padding: 4px 9px;
      font-size: 12px;
      font-weight: 700;
    }

    .lista-tarjetas {
      display: grid;
      gap: 10px;
      min-height: 190px;
    }

    .tarjeta {
      background: #fff;
      border: 1px solid var(--borde);
      border-radius: 10px;
      padding: 13px;
      box-shadow: 0 2px 5px rgba(20, 35, 60, .05);
      cursor: grab;
    }

    .tarjeta:active {
      cursor: grabbing;
    }

    .nombre-tarjeta {
      display: block;
      width: 100%;
      border: 0;
      padding: 5px 2px 10px;
      background: transparent;
      color: var(--texto);
      font-size: 16px;
      font-weight: 700;
      text-align: left;
      overflow-wrap: anywhere;
      cursor: pointer;
    }

    .nombre-tarjeta:hover {
      color: var(--azul);
      text-decoration: underline;
    }

    .tarjeta-ayuda {
      font-size: 12px;
      color: var(--suave);
      padding: 0 2px 8px;
    }

    .acciones-tarjeta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      border-top: 1px solid #edf0f4;
      padding-top: 10px;
      margin-top: 3px;
    }

    .accion {
      border: 0;
      border-radius: 6px;
      padding: 7px 9px;
      font-size: 12px;
      font-weight: 700;
      background: #edf1f7;
      color: var(--texto);
    }

    .accion.editar {
      background: #e9efff;
      color: #254ba8;
    }

    .accion.eliminar {
      background: #fff0f0;
      color: var(--rojo);
    }

    .vacio {
      color: var(--suave);
      font-size: 13px;
      text-align: center;
      padding: 30px 8px;
    }

    .pie {
      margin-top: 22px;
      color: var(--suave);
      font-size: 12px;
      text-align: center;
    }

    .modal-fondo {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(15, 23, 42, .55);
      padding: 18px;
      overflow-y: auto;
      align-items: flex-start;
      justify-content: center;
    }

    .modal-fondo.abierto {
      display: flex;
    }

    .modal {
      background: #fff;
      border-radius: 14px;
      width: 100%;
      max-width: 650px;
      margin: auto;
      box-shadow: 0 15px 50px rgba(0, 0, 0, .2);
      overflow: hidden;
    }

    .modal-cabecera {
      padding: 19px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--borde);
    }

    .modal-cabecera h2 {
      font-size: 20px;
      margin: 0;
      overflow-wrap: anywhere;
    }

    .cerrar {
      background: #f0f2f5;
      border: 0;
      border-radius: 50%;
      width: 35px;
      height: 35px;
      font-size: 22px;
      flex-shrink: 0;
    }

    .modal-cuerpo {
      padding: 22px;
    }

    .formulario {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 15px;
    }

    .campo {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .campo.completo {
      grid-column: 1 / -1;
    }

    .campo label {
      font-size: 13px;
      font-weight: 700;
    }

    .campo input,
    .campo select,
    .campo textarea {
      width: 100%;
      border: 1px solid #cfd5df;
      border-radius: 8px;
      padding: 11px;
      background: #fff;
      color: var(--texto);
    }

    .campo textarea {
      min-height: 95px;
      resize: vertical;
    }

    .modal-pie {
      display: flex;
      justify-content: flex-end;
      gap: 9px;
      flex-wrap: wrap;
      padding: 16px 22px;
      border-top: 1px solid var(--borde);
      background: #fafbfc;
    }

    .ficha-datos {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 17px;
    }

    .dato {
      padding: 12px;
      border-radius: 9px;
      background: #f6f8fb;
      min-width: 0;
    }

    .dato.completo {
      grid-column: 1 / -1;
    }

    .dato span {
      display: block;
      font-size: 12px;
      color: var(--suave);
      margin-bottom: 7px;
    }

    .dato strong {
      display: block;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      font-size: 15px;
      line-height: 1.45;
    }

    .estado-etiqueta {
      display: inline-block;
      border-radius: 20px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
    }

    .estado-espera {
      color: #85520c;
      background: #fff1d6;
    }

    .estado-taller {
      color: #254ba8;
      background: #e5edff;
    }

    .estado-entregado {
      color: #126b47;
      background: #dff5e8;
    }

    .sin-datos {
      color: #98a2b3 !important;
      font-weight: 400 !important;
    }

    @media (max-width: 900px) {
      .tablero {
        grid-template-columns: 1fr;
      }

      .estadisticas {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 520px) {
      .encabezado {
        padding: 18px;
      }

      .contenedor {
        padding: 16px;
      }

      .estadistica {
        padding: 13px;
      }

      .estadistica strong {
        font-size: 21px;
      }

      .formulario,
      .ficha-datos {
        grid-template-columns: 1fr;
      }

      .campo.completo,
      .dato.completo {
        grid-column: auto;
      }

      .modal-cuerpo {
        padding: 16px;
      }

      .herramientas input,
      .herramientas select {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <header class="encabezado">
    <div class="marca">
      <h1>🧵 Control de Modista</h1>
      <p>Organizá tus clientes, prendas y entregas</p>
    </div>
    <button class="boton boton-principal" id="nuevaPrenda">
      + Nueva prenda
    </button>
  </header>

  <main class="contenedor">
    <section class="estadisticas">
      <div class="estadistica">
        <span>Total de trabajos</span>
        <strong id="totalTrabajos">0</strong>
      </div>
      <div class="estadistica">
        <span>En espera</span>
        <strong id="totalEspera">0</strong>
      </div>
      <div class="estadistica">
        <span>En taller</span>
        <strong id="totalTaller">0</strong>
      </div>
      <div class="estadistica">
        <span>Entregados</span>
        <strong id="totalEntregados">0</strong>
      </div>
    </section>

    <section class="herramientas">
      <input
        id="busqueda"
        type="search"
        placeholder="Buscar empresa o cliente..."
        aria-label="Buscar empresa o cliente"
      >

      <select id="filtroEstado" aria-label="Filtrar por estado">
        <option value="">Todos los estados</option>
        <option value="espera">En espera</option>
        <option value="taller">En taller</option>
        <option value="entregado">Entregado</option>
      </select>

      <button class="boton boton-secundario" id="exportar">
        Exportar copia
      </button>

      <button class="boton boton-secundario" id="importar">
        Importar copia
      </button>

      <input
        type="file"
        id="archivoImportacion"
        accept=".json,application/json"
        hidden
      >
    </section>

    <section class="tablero">
      <div class="columna" data-estado="espera">
        <div class="columna-cabecera">
          <h2>🕒 En espera</h2>
          <span class="cantidad" id="cantidadEspera">0</span>
        </div>
        <div class="lista-tarjetas" id="listaEspera"></div>
      </div>

      <div class="columna" data-estado="taller">
        <div class="columna-cabecera">
          <h2>🧵 En taller</h2>
          <span class="cantidad" id="cantidadTaller">0</span>
        </div>
        <div class="lista-tarjetas" id="listaTaller"></div>
      </div>

      <div class="columna" data-estado="entregado">
        <div class="columna-cabecera">
          <h2>✅ Entregado</h2>
          <span class="cantidad" id="cantidadEntregado">0</span>
        </div>
        <div class="lista-tarjetas" id="listaEntregado"></div>
      </div>
    </section>

    <p class="pie">
      Los datos se guardan en este navegador. Usá «Exportar copia»
      para conservar un respaldo.
    </p>
  </main>

  <!-- Ventana para crear y editar -->
  <div class="modal-fondo" id="modalFormulario" role="dialog"
       aria-modal="true" aria-labelledby="tituloFormulario">
    <div class="modal">
      <div class="modal-cabecera">
        <h2 id="tituloFormulario">Nueva prenda</h2>
        <button class="cerrar" type="button" data-cerrar="modalFormulario"
                aria-label="Cerrar">×</button>
      </div>

      <form id="formularioPrenda">
        <div class="modal-cuerpo">
          <div class="formulario">
            <div class="campo completo">
              <label for="cliente">Nombre de la empresa o cliente *</label>
              <input id="cliente" name="cliente" required maxlength="120"
                     placeholder="Ej.: Taller López o María Pérez">
            </div>

            <div class="campo">
              <label for="telefono">Teléfono / WhatsApp</label>
              <input id="telefono" name="telefono" type="tel"
                     placeholder="Ej.: 3511234567">
            </div>

            <div class="campo">
              <label for="prenda">Prenda o trabajo *</label>
              <input id="prenda" name="prenda" required maxlength="150"
                     placeholder="Ej.: Pantalón, vestido">
            </div>

            <div class="campo">
              <label for="ingreso">Fecha de ingreso</label>
              <input id="ingreso" name="ingreso" type="date">
            </div>

            <div class="campo">
              <label for="entrega">Fecha de entrega</label>
              <input id="entrega" name="entrega" type="date">
            </div>

            <div class="campo">
              <label for="precio">Precio ($)</label>
              <input id="precio" name="precio" type="number"
                     min="0" step="0.01" placeholder="0">
            </div>

            <div class="campo">
              <label for="estado">Estado del trabajo</label>
              <select id="estado" name="estado">
                <option value="espera">En espera</option>
                <option value="taller">En taller</option>
                <option value="entregado">Entregado</option>
              </select>
            </div>

            <div class="campo completo">
              <label for="notas">Detalles y observaciones</label>
              <textarea id="notas" name="notas"
                        placeholder="Medidas, arreglos, telas, señas, etc."></textarea>
            </div>
          </div>
        </div>

        <div class="modal-pie">
          <button class="boton boton-secundario" type="button"
                  data-cerrar="modalFormulario">Cancelar</button>
          <button class="boton boton-principal" type="submit">
            Guardar prenda
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Ficha con toda la información -->
  <div class="modal-fondo" id="modalDetalle" role="dialog"
       aria-modal="true" aria-labelledby="tituloDetalle">
    <div class="modal">
      <div class="modal-cabecera">
        <h2 id="tituloDetalle">Ficha del trabajo</h2>
        <button class="cerrar" type="button" data-cerrar="modalDetalle"
                aria-label="Cerrar">×</button>
      </div>

      <div class="modal-cuerpo">
        <div class="ficha-datos" id="datosDetalle"></div>
      </div>

      <div class="modal-pie">
        <button class="boton boton-secundario" type="button"
                data-cerrar="modalDetalle">Cerrar</button>
        <button class="boton boton-verde" id="whatsappDetalle" type="button">
          Enviar por WhatsApp
        </button>
        <button class="boton boton-principal" id="editarDetalle" type="button">
          Editar ficha
        </button>
      </div>
    </div>
  </div>

  <script>
    (() => {
      "use strict";

      const CLAVE = "controlModistaPrendas_v3";
      const ESTADOS = ["espera", "taller", "entregado"];

      const NOMBRES_ESTADO = {
        espera: "En espera",
        taller: "En taller",
        entregado: "Entregado"
      };

      const $ = (selector) => document.querySelector(selector);

      let prendas = cargarPrendas();
      let idEnEdicion = null;
      let idEnDetalle = null;
      let idArrastrado = null;

      function generarId() {
        if (window.crypto && typeof window.crypto.randomUUID === "function") {
          return window.crypto.randomUUID();
        }
        return Date.now().toString(36) + Math.random().toString(36).slice(2);
      }

      function cargarPrendas() {
        try {
          const guardado = localStorage.getItem(CLAVE);
          if (!guardado) return [];

          const datos = JSON.parse(guardado);
          if (!Array.isArray(datos)) return [];

          return datos.map((p) => normalizarPrenda(p));
        } catch (error) {
          console.error("No se pudieron cargar los trabajos:", error);
          return [];
        }
      }

      function normalizarPrenda(p) {
        const estadoOriginal = String(p.estado || "espera").toLowerCase();
        let estado = estadoOriginal;

        if (["en espera", "pendiente", "espera"].includes(estado)) {
          estado = "espera";
        } else if (["en taller", "taller", "en proceso", "proceso"].includes(estado)) {
          estado = "taller";
        } else if (["entregado", "terminado", "finalizado"].includes(estado)) {
          estado = "entregado";
        } else {
          estado = "espera";
        }

        return {
          id: String(p.id || generarId()),
          cliente: String(p.cliente || p.empresa || p.nombre || ""),
          telefono: String(p.telefono || p.whatsapp || ""),
          prenda: String(p.prenda || p.trabajo || ""),
          ingreso: String(p.ingreso || ""),
          entrega: String(p.entrega || ""),
          precio: p.precio === undefined || p.precio === null ? "" : String(p.precio),
          estado,
          notas: String(p.notas || p.observaciones || "")
        };
      }

      function guardarPrendas() {
        try {
          localStorage.setItem(CLAVE, JSON.stringify(prendas));
          return true;
        } catch (error) {
          console.error("No se pudieron guardar los datos:", error);
          alert("No se pudieron guardar los datos en este navegador. Exportá una copia y revisá el espacio disponible.");
          return false;
        }
      }

      function escapar(valor) {
        return String(valor ?? "").replace(/[&<>"']/g, (caracter) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        })[caracter]);
      }

      function mostrarValor(valor) {
        return valor === undefined || valor === null || String(valor).trim() === ""
          ? "Sin especificar"
          : String(valor);
      }

      function formatearFecha(fecha) {
        if (!fecha) return "Sin especificar";
        const partes = String(fecha).split("-");
        if (partes.length !== 3) return fecha;
        return partes[2] + "/" + partes[1] + "/" + partes[0];
      }

      function formatearPrecio(precio) {
        if (precio === "" || precio === null || precio === undefined) {
          return "Sin especificar";
        }

        const numero = Number(precio);
        if (!Number.isFinite(numero)) return String(precio);

        return numero.toLocaleString("es-AR", {
          style: "currency",
          currency: "ARS",
          maximumFractionDigits: 2
        });
      }

      function abrirModal(id) {
        $("#" + id).classList.add("abierto");
      }

      function cerrarModal(id) {
        $("#" + id).classList.remove("abierto");
      }

      function cerrarTodosLosModales() {
        document.querySelectorAll(".modal-fondo").forEach((modal) => {
          modal.classList.remove("abierto");
        });
      }

      function nuevaPrenda() {
        idEnEdicion = null;
        $("#formularioPrenda").reset();
        $("#estado").value = "espera";
        $("#tituloFormulario").textContent = "Nueva prenda";
        abrirModal("modalFormulario");
        $("#cliente").focus();
      }

      function editarPrenda(id) {
        const p = prendas.find((item) => item.id === id);
        if (!p) return;

        idEnEdicion = id;
        $("#formularioPrenda").reset();

        $("#cliente").value = p.cliente;
        $("#telefono").value = p.telefono;
        $("#prenda").value = p.prenda;
        $("#ingreso").value = p.ingreso;
        $("#entrega").value = p.entrega;
        $("#precio").value = p.precio;
        $("#estado").value = p.estado;
        $("#notas").value = p.notas;

        $("#tituloFormulario").textContent = "Editar trabajo";
        cerrarModal("modalDetalle");
        abrirModal("modalFormulario");
        $("#cliente").focus();
      }

      function abrirDetalle(id) {
        const p = prendas.find((item) => item.id === id);
        if (!p) return;

        idEnDetalle = id;
        $("#tituloDetalle").textContent = p.cliente || "Ficha del trabajo";

        const estadoClase = {
          espera: "estado-espera",
          taller: "estado-taller",
          entregado: "estado-entregado"
        }[p.estado] || "estado-espera";

        const datos = [
          ["Empresa o cliente", p.cliente, false],
          ["Teléfono / WhatsApp", p.telefono, false],
          ["Prenda o trabajo", p.prenda, false],
          ["Fecha de ingreso", formatearFecha(p.ingreso), false],
          ["Fecha de entrega", formatearFecha(p.entrega), false],
          ["Precio", formatearPrecio(p.precio), false],
          ["Estado", NOMBRES_ESTADO[p.estado] || "En espera", true],
          ["Detalles y observaciones", p.notas, false, true]
        ];

        $("#datosDetalle").innerHTML = datos.map((dato) => {
          const etiqueta = escapar(dato[0]);
          const valor = escapar(mostrarValor(dato[1]));
          const claseCompleto = dato[3] ? " completo" : "";

          if (dato[2]) {
            return `
              <div class="dato${claseCompleto}">
                <span>${etiqueta}</span>
                <strong><span class="estado-etiqueta ${estadoClase}">${valor}</span></strong>
              </div>
            `;
          }

          const claseSinDatos = dato[1] === "" ? "sin-datos" : "";
          return `
            <div class="dato${claseCompleto}">
              <span>${etiqueta}</span>
              <strong class="${claseSinDatos}">${valor}</strong>
            </div>
          `;
        }).join("");

        abrirModal("modalDetalle");
      }

      function renderizar() {
        const busqueda = $("#busqueda").value.trim().toLocaleLowerCase("es-AR");
        const filtro = $("#filtroEstado").value;

        const filtradas = prendas.filter((p) => {
          const coincideBusqueda = [
            p.cliente, p.telefono, p.prenda, p.notas
          ].join(" ").toLocaleLowerCase("es-AR").includes(busqueda);

          const coincideEstado = !filtro || p.estado === filtro;
          return coincideBusqueda && coincideEstado;
        });

        const listas = {
          espera: $("#listaEspera"),
          taller: $("#listaTaller"),
          entregado: $("#listaEntregado")
        };

        Object.values(listas).forEach((lista) => {
          lista.innerHTML = "";
        });

        ESTADOS.forEach((estado) => {
          const lista = listas[estado];
          const elementos = filtradas.filter((p) => p.estado === estado);

          $("#cantidad" + capitalizar(estado)).textContent = elementos.length;

          if (elementos.length === 0) {
            lista.innerHTML = '<div class="vacio">No hay trabajos en esta columna</div>';
            return;
          }

          elementos.forEach((p) => {
            const tarjeta = document.createElement("article");
            tarjeta.className = "tarjeta";
            tarjeta.draggable = true;
            tarjeta.dataset.id = p.id;

            tarjeta.innerHTML = `
              <button class="nombre-tarjeta" type="button" data-accion="detalle">
                ${escapar(p.cliente || "Cliente sin nombre")}
              </button>
              <div class="tarjeta-ayuda">Hacé clic en el nombre para ver la ficha completa</div>
              <div class="acciones-tarjeta">
                <button class="accion editar" type="button" data-accion="editar">Editar</button>
                ${estado !== "espera" ? '<button class="accion" type="button" data-accion="anterior">← Estado anterior</button>' : ""}
                ${estado !== "entregado" ? '<button class="accion" type="button" data-accion="siguiente">Avanzar →</button>' : ""}
                <button class="accion eliminar" type="button" data-accion="eliminar">Eliminar</button>
              </div>
            `;

            tarjeta.addEventListener("click", (evento) => {
              const boton = evento.target.closest("[data-accion]");
              if (!boton) {
                abrirDetalle(p.id);
                return;
              }

              const accion = boton.dataset.accion;

              if (accion === "detalle") abrirDetalle(p.id);
              if (accion === "editar") editarPrenda(p.id);
              if (accion === "siguiente") moverEstado(p.id, 1);
              if (accion === "anterior") moverEstado(p.id, -1);
              if (accion === "eliminar") eliminarPrenda(p.id);
            });

            tarjeta.addEventListener("dragstart", (evento) => {
              idArrastrado = p.id;
              tarjeta.style.opacity = ".5";
              if (evento.dataTransfer) {
                evento.dataTransfer.setData("text/plain", p.id);
                evento.dataTransfer.effectAllowed = "move";
              }
            });

            tarjeta.addEventListener("dragend", () => {
              tarjeta.style.opacity = "1";
              idArrastrado = null;
              document.querySelectorAll(".columna").forEach((columna) => {
                columna.classList.remove("cargando");
              });
            });

            lista.appendChild(tarjeta);
          });
        });

        actualizarEstadisticas();
      }

      function capitalizar(texto) {
        return texto.charAt(0).toUpperCase() + texto.slice(1);
      }

      function actualizarEstadisticas() {
        $("#totalTrabajos").textContent = prendas.length;
        $("#totalEspera").textContent = prendas.filter(p => p.estado === "espera").length;
        $("#totalTaller").textContent = prendas.filter(p => p.estado === "taller").length;
        $("#totalEntregados").textContent = prendas.filter(p => p.estado === "entregado").length;
      }

      function moverEstado(id, direccion) {
        const p = prendas.find((item) => item.id === id);
        if (!p) return;

        const posicion = ESTADOS.indexOf(p.estado);
        const nuevaPosicion = posicion + direccion;

        if (nuevaPosicion < 0 || nuevaPosicion >= ESTADOS.length) return;

        p.estado = ESTADOS[nuevaPosicion];
        guardarPrendas();
        renderizar();
      }

      function eliminarPrenda(id) {
        const p = prendas.find((item) => item.id === id);
        if (!p) return;

        if (!confirm('¿Querés eliminar el trabajo de "' + p.cliente + '"? Esta acción no se puede deshacer.')) {
          return;
        }

        prendas = prendas.filter((item) => item.id !== id);
        guardarPrendas();
        cerrarTodosLosModales();
        renderizar();
      }

      function enviarWhatsApp(p) {
        if (!p) return;

        if (!p.telefono.trim()) {
          alert("Esta ficha no tiene un teléfono cargado. Podés agregarlo editando el trabajo.");
          return;
        }

        const mensaje = [
          "CONTROL DE MODISTA",
          "",
          "Empresa o cliente: " + mostrarValor(p.cliente),
          "Teléfono: " + mostrarValor(p.telefono),
          "Prenda o trabajo: " + mostrarValor(p.prenda),
          "Fecha de ingreso: " + formatearFecha(p.ingreso),
          "Fecha de entrega: " + formatearFecha(p.entrega),
          "Precio: " + formatearPrecio(p.precio),
          "Estado: " + (NOMBRES_ESTADO[p.estado] || "En espera"),
          "Detalles: " + mostrarValor(p.notas)
        ].join("\n");

        const telefono = p.telefono.replace(/\D/g, "");
        const url = "https://wa.me/" + telefono + "?text=" + encodeURIComponent(mensaje);
        window.open(url, "_blank", "noopener,noreferrer");
      }

      $("#formularioPrenda").addEventListener("submit", (evento) => {
        evento.preventDefault();

        const cliente = $("#cliente").value.trim();
        const prenda = $("#prenda").value.trim();

        if (!cliente || !prenda) {
          alert("Completá el nombre de la empresa o cliente y la prenda.");
          return;
        }

        const datos = {
          cliente,
          telefono: $("#telefono").value.trim(),
          prenda,
          ingreso: $("#ingreso").value,
          entrega: $("#entrega").value,
          precio: $("#precio").value,
          estado: $("#estado").value,
          notas: $("#notas").value.trim()
        };

        if (idEnEdicion) {
          const indice = prendas.findIndex((p) => p.id === idEnEdicion);
          if (indice !== -1) {
            prendas[indice] = { ...prendas[indice], ...datos };
          }
        } else {
          prendas.push({ id: generarId(), ...datos });
        }

        guardarPrendas();
        cerrarModal("modalFormulario");
        idEnEdicion = null;
        renderizar();
      });

      $("#nuevaPrenda").addEventListener("click", nuevaPrenda);

      $("#busqueda").addEventListener("input", renderizar);
      $("#filtroEstado").addEventListener("change", renderizar);

      $("#editarDetalle").addEventListener("click", () => {
        if (idEnDetalle) editarPrenda(idEnDetalle);
      });

      $("#whatsappDetalle").addEventListener("click", () => {
        const p = prendas.find((item) => item.id === idEnDetalle);
        enviarWhatsApp(p);
      });

      document.querySelectorAll("[data-cerrar]").forEach((boton) => {
        boton.addEventListener("click", () => cerrarModal(boton.dataset.cerrar));
      });

      document.querySelectorAll(".modal-fondo").forEach((fondo) => {
        fondo.addEventListener("click", (evento) => {
          if (evento.target === fondo) fondo.classList.remove("abierto");
        });
      });

      document.addEventListener("keydown", (evento) => {
        if (evento.key === "Escape") cerrarTodosLosModales();
      });

      document.querySelectorAll(".columna").forEach((columna) => {
        columna.addEventListener("dragover", (evento) => {
          evento.preventDefault();
          columna.classList.add("cargando");
        });

        columna.addEventListener("dragleave", (evento) => {
          if (!columna.contains(evento.relatedTarget)) {
            columna.classList.remove("cargando");
          }
        });

        columna.addEventListener("drop", (evento) => {
          evento.preventDefault();
          columna.classList.remove("cargando");

          const id = (evento.dataTransfer && evento.dataTransfer.getData("text/plain")) || idArrastrado;
          const nuevoEstado = columna.dataset.estado;
          const p = prendas.find((item) => item.id === id);

          if (!p || !ESTADOS.includes(nuevoEstado) || p.estado === nuevoEstado) return;

          p.estado = nuevoEstado;
          guardarPrendas();
          renderizar();
        });
      });

      $("#exportar").addEventListener("click", () => {
        const archivo = new Blob(
          [JSON.stringify(prendas, null, 2)],
          { type: "application/json;charset=utf-8" }
        );

        const url = URL.createObjectURL(archivo);
        const enlace = document.createElement("a");
        enlace.href = url;
        enlace.download = "respaldo-control-de-modista.json";
        document.body.appendChild(enlace);
        enlace.click();
        enlace.remove();
        URL.revokeObjectURL(url);
      });

      $("#importar").addEventListener("click", () => {
        $("#archivoImportacion").click();
      });

      $("#archivoImportacion").addEventListener("change", async (evento) => {
        const archivo = evento.target.files[0];
        if (!archivo) return;

        try {
          const contenido = await archivo.text();
          const datos = JSON.parse(contenido);

          if (!Array.isArray(datos)) {
            throw new Error("El archivo no contiene una lista válida de trabajos.");
          }

          if (!confirm("Importar esta copia reemplazará los trabajos que están actualmente en el navegador. ¿Querés continuar?")) {
            evento.target.value = "";
            return;
          }

          prendas = datos.map(normalizarPrenda);
          guardarPrendas();
          renderizar();
          alert("Copia importada correctamente.");
        } catch (error) {
          alert("No se pudo importar el archivo. Verificá que sea una copia JSON válida.");
          console.error(error);
        } finally {
          evento.target.value = "";
        }
      });

      renderizar();
    })();
  </script>
</body>
</html>
