<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Modista</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet"
 href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
* { box-sizing: border-box; }

body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f1f5f9;
    color: #1e293b;
}

header {
    background: #4f46e5;
    color: white;
    padding: 18px;
}

.contenedor {
    max-width: 1400px;
    margin: auto;
    padding: 20px;
}

button {
    cursor: pointer;
    border: none;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 14px;
}

.nuevo { background: #10b981; color: white; }
.reporte { background: #6366f1; color: white; }

.resumen {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 20px;
}

.stat {
    background: white;
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 1px 4px #0001;
}

.filtros {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

input, select, textarea {
    padding: 11px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font: inherit;
    min-width: 0;
}

#buscador { flex: 1; }

.tablero {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
    align-items: start;
}

.columna {
    padding: 12px;
    border-radius: 12px;
    min-height: 300px;
}

.espera { background: #fef3c7; }
.taller { background: #dbeafe; }
.entregado { background: #d1fae5; }

.titulo-columna {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    font-weight: bold;
}

.lista {
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 220px;
}

.tarjeta {
    background: white;
    padding: 15px;
    border-radius: 10px;
    border: 1px solid #e2e8f0;
    box-shadow: 0 2px 5px #0000000d;
    overflow-wrap: anywhere;
}

.tarjeta h4 { margin: 0 0 8px; }
.empresa { color: #4f46e5; font-weight: bold; }
.detalle { font-size: 13px; color: #64748b; }

.acciones {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid #e2e8f0;
}

.acciones select { flex: 1; width: 100%; }
.editar { background: #e0e7ff; }
.eliminar { background: #fee2e2; }

.modal {
    position: fixed;
    inset: 0;
    background: #0008;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 12px;
    z-index: 10;
}

.modal-contenido {
    background: white;
    border-radius: 14px;
    padding: 20px;
    width: 100%;
    max-width: 500px;
    max-height: 95dvh;
    overflow-y: auto;
}

#formPrenda {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

#formPrenda label {
    display: block;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 5px;
}

#formPrenda input,
#formPrenda select,
#formPrenda textarea {
    width: 100%;
}

.campo-doble {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 10px;
}

.boton-guardar {
    background: #4f46e5;
    color: white;
}

.boton-cancelar {
    background: #e2e8f0;
}

@media (max-width: 700px) {
    .contenedor { padding: 12px; }

    header .botones {
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
        margin-top: 12px;
    }

    header button { width: 100%; min-height: 44px; }

    .resumen { grid-template-columns: repeat(2, 1fr); }
    .stat { padding: 12px; }

    .tablero {
        display: flex;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        gap: 12px;
        padding-bottom: 12px;
        -webkit-overflow-scrolling: touch;
    }

    .columna {
        flex: 0 0 85vw;
        max-width: 360px;
        scroll-snap-align: start;
    }

    .filtros { flex-direction: column; }
    .filtros input, .filtros select { width: 100%; }
    button { min-height: 40px; }
}
</style>
</head>

<body>

<header>
    <h1><i class="fa-solid fa-scissors"></i> Control de Modista</h1>
    <p>Gestión de prendas y modificaciones</p>

    <div class="botones">
        <button class="reporte" onclick="abrirReporte()">
            <i class="fa-brands fa-whatsapp"></i>
            Resumen / WhatsApp
        </button>

        <button class="nuevo" onclick="abrirModal()">
            <i class="fa-solid fa-plus"></i> Nueva prenda
        </button>
    </div>
</header>

<main class="contenedor">

    <div class="resumen">
        <div class="stat">Total<h2 id="total">0</h2></div>
        <div class="stat">En espera<h2 id="totalEspera">0</h2></div>
        <div class="stat">En taller<h2 id="totalTaller">0</h2></div>
        <div class="stat">Entregadas<h2 id="totalEntregado">0</h2></div>
    </div>

    <div class="filtros">
        <input id="buscador" placeholder="Buscar prenda o empresa..."
               oninput="renderizar()">

        <select id="filtroEstado" onchange="renderizar()">
            <option value="">Todos los estados</option>
            <option>En espera</option>
            <option>En taller</option>
            <option>Entregado</option>
        </select>

        <button onclick="limpiarFiltros()">Limpiar</button>
    </div>

    <h2>Tablero de prendas</h2>
    <p>En celular, deslizá hacia los costados para ver las columnas.</p>

    <div class="tablero">

        <section class="columna espera" data-estado="En espera"
                 ondragover="permitirSoltar(event)"
                 ondrop="soltar(event)">
            <div class="titulo-columna">
                <span>🕒 En espera</span>
                <span id="contadorEspera">0</span>
            </div>
            <div class="lista" id="listaEspera"></div>
        </section>

        <section class="columna taller" data-estado="En taller"
                 ondragover="permitirSoltar(event)"
                 ondrop="soltar(event)">
            <div class="titulo-columna">
                <span>🧵 En taller</span>
                <span id="contadorTaller">0</span>
            </div>
            <div class="lista" id="listaTaller"></div>
        </section>

        <section class="columna entregado" data-estado="Entregado"
                 ondragover="permitirSoltar(event)"
                 ondrop="soltar(event)">
            <div class="titulo-columna">
                <span>✅ Entregado</span>
                <span id="contadorEntregado">0</span>
            </div>
            <div class="lista" id="listaEntregado"></div>
        </section>

    </div>
</main>

<!-- FORMULARIO -->
<div class="modal" id="modal">
    <div class="modal-contenido">
        <h2 id="tituloModal">Nueva prenda</h2>

        <form id="formPrenda" onsubmit="guardar(event)">
            <input type="hidden" id="id">

            <div>
                <label>Empresa</label>
                <input id="empresa" required>
            </div>

            <div class="campo-doble">
                <div>
                    <label>Prenda</label>
                    <input id="prenda" required>
                </div>
                <div>
                    <label>Talle</label>
                    <input id="talle" required>
                </div>
            </div>

            <div class="campo-doble">
                <div>
                    <label>Cantidad</label>
                    <input id="cantidad" type="number" min="1"
                           value="1" required>
                </div>
                <div>
                    <label>Fecha de envío</label>
                    <input id="fecha" type="date" required>
                </div>
            </div>

            <div>
                <label>Modificación</label>
                <textarea id="modificacion" rows="3" required></textarea>
            </div>

            <div>
                <label>Estado</label>
                <select id="estado">
                    <option>En espera</option>
                    <option>En taller</option>
                    <option>Entregado</option>
                </select>
            </div>

            <button class="boton-guardar" type="submit">Guardar</button>
            <button class="boton-cancelar" type="button"
                    onclick="cerrarModal()">Cancelar</button>
        </form>
    </div>
</div>

<!-- RESUMEN -->
<div class="modal" id="modalReporte">
    <div class="modal-contenido">
        <h2>Resumen de prendas</h2>
        <textarea id="textoReporte" rows="12"
                  style="width:100%"></textarea>
        <button class="boton-guardar" onclick="copiarReporte()">
            Copiar resumen
        </button>
        <button class="nuevo" onclick="enviarWhatsApp()">
            Enviar por WhatsApp
        </button>
        <button class="boton-cancelar"
                onclick="cerrarReporte()">Cerrar</button>
    </div>
</div>

<script>
let prendas = JSON.parse(localStorage.getItem("prendas_modista")) || [];

// Adaptar registros creados con versiones anteriores.
prendas = prendas.map(p => ({
    ...p,
    estado: p.estado === "Pendiente" ? "En espera" :
            p.estado === "Finalizado" ? "Entregado" :
            p.estado || "En espera"
}));

const $ = id => document.getElementById(id);

function guardarDatos() {
    localStorage.setItem("prendas_modista", JSON.stringify(prendas));
    renderizar();
}

function abrirModal(id = null) {
    $("formPrenda").reset();
    $("id").value = "";
    $("cantidad").value = 1;
    $("fecha").value = new Date().toISOString().slice(0, 10);
    $("tituloModal").textContent = id ? "Editar prenda" : "Nueva prenda";

    if (id !== null) {
        const p = prendas.find(x => x.id == id);
        if (!p) return;

        $("id").value = p.id;
        $("empresa").value = p.empresa;
        $("prenda").value = p.nombrePrenda;
        $("talle").value = p.talle;
        $("cantidad").value = p.cantidad;
        $("fecha").value = p.fechaEnvio;
        $("modificacion").value = p.modificacion;
        $("estado").value = p.estado;
    }

    $("modal").style.display = "flex";
}

function cerrarModal() {
    $("modal").style.display = "none";
}

function guardar(e) {
    e.preventDefault();

    const id = $("id").value;
    const datos = {
        id: id ? Number(id) : Date.now(),
        empresa: $("empresa").value.trim(),
        nombrePrenda: $("prenda").value.trim(),
        talle: $("talle").value.trim(),
        cantidad: Number($("cantidad").value),
        fechaEnvio: $("fecha").value,
        modificacion: $("modificacion").value.trim(),
        estado: $("estado").value
    };

    if (id) {
        const indice = prendas.findIndex(p => p.id == id);
        if (indice !== -1) prendas[indice] = datos;
    } else {
        prendas.unshift(datos);
    }

    guardarDatos();
    cerrarModal();
}

function eliminarPrenda(id) {
    if (!confirm("¿Querés eliminar esta prenda?")) return;
    prendas = prendas.filter(p => p.id != id);
    guardarDatos();
}

function cambiarEstado(id, estado) {
    const p = prendas.find(p => p.id == id);
    if (!p) return;
    p.estado = estado;
    guardarDatos();
}

function permitirSoltar(e) {
    e.preventDefault();
}

function soltar(e) {
    e.preventDefault();
    const id = e.dataTransfer.getData("text/plain");
    cambiarEstado(id, e.currentTarget.dataset.estado);
}

function renderizar() {
    const columnas = {
        "En espera": $("listaEspera"),
        "En taller": $("listaTaller"),
        "Entregado": $("listaEntregado")
    };

    Object.values(columnas).forEach(c => c.innerHTML = "");

    const busqueda = $("buscador").value.toLowerCase();
    const filtro = $("filtroEstado").value;

    const lista = prendas.filter(p => {
        const texto = [
            p.empresa, p.nombrePrenda, p.talle, p.modificacion
        ].join(" ").toLowerCase();

        return texto.includes(busqueda) &&
               (!filtro || p.estado === filtro);
    });

    const conteos = {
        "En espera": 0,
        "En taller": 0,
        "Entregado": 0
    };

    lista.forEach(p => {
        const estado = columnas[p.estado] ? p.estado : "En espera";
        conteos[estado]++;

        const tarjeta = document.createElement("article");
        tarjeta.className = "tarjeta";
        tarjeta.draggable = true;

        tarjeta.ondragstart = e => {
            e.dataTransfer.setData("text/plain", p.id);
        };

        const titulo = document.createElement("h4");
        titulo.textContent = p.nombrePrenda;

        const empresa = document.createElement("p");
        empresa.className = "empresa";
        empresa.textContent = p.empresa;

        const detalle = document.createElement("p");
        detalle.className = "detalle";
        detalle.textContent =
            `Talle: ${p.talle} | Cantidad: ${p.cantidad}`;

        const modificacion = document.createElement("p");
        modificacion.textContent = p.modificacion;

        const fecha = document.createElement("p");
        fecha.className = "detalle";
        fecha.textContent = "Envío: " +
            (p.fechaEnvio || "").split("-").reverse().join("/");

        const acciones = document.createElement("div");
        acciones.className = "acciones";

        const selector = document.createElement("select");

        ["En espera", "En taller", "Entregado"].forEach(estado => {
            const opcion = document.createElement("option");
            opcion.value = estado;
            opcion.textContent = estado;
            opcion.selected = estado === p.estado;
            selector.appendChild(opcion);
        });

        selector.onchange = () => cambiarEstado(p.id, selector.value);

        const editar = document.createElement("button");
        editar.className = "editar";
        editar.textContent = "✏️";
        editar.onclick = () => abrirModal(p.id);

        const borrar = document.createElement("button");
        borrar.className = "eliminar";
        borrar.textContent = "🗑️";
        borrar.onclick = () => eliminarPrenda(p.id);

        acciones.append(selector, editar, borrar);
        tarjeta.append(titulo, empresa, detalle,
                       modificacion, fecha, acciones);
        columnas[estado].appendChild(tarjeta);
    });

    $("total").textContent = prendas.length;
    $("totalEspera").textContent = prendas.filter(
        p => p.estado === "En espera").length;
    $("totalTaller").textContent = prendas.filter(
        p => p.estado === "En taller").length;
    $("totalEntregado").textContent = prendas.filter(
        p => p.estado === "Entregado").length;

    $("contadorEspera").textContent = conteos["En espera"];
    $("contadorTaller").textContent = conteos["En taller"];
    $("contadorEntregado").textContent = conteos["Entregado"];

    Object.entries(columnas).forEach(([estado, columna]) => {
        if (!columna.children.length) {
            const vacio = document.createElement("p");
            vacio.className = "detalle";
            vacio.textContent = "No hay prendas";
            columna.appendChild(vacio);
        }
    });
}

function limpiarFiltros() {
    $("buscador").value = "";
    $("filtroEstado").value = "";
    renderizar();
}

function abrirReporte() {
    $("textoReporte").value = prendas.map((p, i) =>
        `${i + 1}. ${p.nombrePrenda} - Talle: ${p.talle}\n` +
        `Empresa: ${p.empresa}\nCantidad: ${p.cantidad}\n` +
        `Modificación: ${p.modificacion}\nEstado: ${p.estado}`
    ).join("\n\n");

    $("modalReporte").style.display = "flex";
}

function cerrarReporte() {
    $("modalReporte").style.display = "none";
}

async function copiarReporte() {
    try {
        await navigator.clipboard.writeText($("textoReporte").value);
        alert("Resumen copiado");
    } catch {
        $("textoReporte").select();
        document.execCommand("copy");
        alert("Resumen copiado");
    }
}

function enviarWhatsApp() {
    const texto = encodeURIComponent($("textoReporte").value);
    window.open("https://wa.me/?text=" + texto, "_blank");
}

renderizar();
</script>

</body>
</html>
